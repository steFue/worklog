services:
  postgres:
    image: postgres:16-alpine
    container_name: worklog-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - worklog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d worklog"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  worklog_pgdata: