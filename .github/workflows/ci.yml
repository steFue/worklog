name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java 17 + Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Docker (Testcontainers)
        run: docker version

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run tests with Maven Wrapper
        run: ./mvnw -B -ntp test

      - name: Upload test reports if failed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            target/surefire-reports

  docker:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Docker build (validate image builds)
        run: docker build -t worklog-api:ci .
